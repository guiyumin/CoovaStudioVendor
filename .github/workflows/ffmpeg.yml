name: ffmpeg

on:
  workflow_dispatch:
  push:
    tags: ["ffmpeg-*"] # e.g. ffmpeg-9.0.1, or ffmpeg-9.0.1-2 for a rebuild

jobs:
  macos-arm64:
    runs-on: macos-latest # Apple silicon
    permissions:
      contents: write # gh release create needs it; the default token is read-only
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          brew install meson ninja
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: work/ffmpeg/downloads
          key: ffmpeg-sources-${{ hashFiles('ffmpeg/build.sh') }}

      - name: Build
        run: ffmpeg/build.sh

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-macos-arm64
          path: dist/ffmpeg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/ffmpeg-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/ffmpeg/BUILD-INFO.txt \
            dist/ffmpeg/*.tar.gz dist/ffmpeg/SHA256SUMS dist/ffmpeg/sources/*
